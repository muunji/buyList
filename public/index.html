  <script>
    // 클래스 정하는 첫번째 화면
    // splash만 화면에 보임
    document.getElementById('root').style.display = 'none';
    // 선택한 클래스 -> 값 저장 & 적용

    //데이터배열
    let colorArr =['one','two','three','four']
    // 선택할 요소 생성
    let colorSection = sectionColorDiv(colorArr);
    document.getElementById('splash').appendChild(colorSection);

    // 선택한 요소 값 가져오기
    let chatClassName = null

    let colorDivs = document.querySelectorAll('#splash div')
    colorDivs.forEach(div => {
      div.addEventListener('click',(e)=>{
        chatClassName = selectColorDiv(e)
        //splash 안보이기
        document.getElementById('splash').style.display = 'none';
        // 버튼 선택하는 화면 div#root 보여주기
        document.getElementById('root').style.display = 'block';

        let icons = document.querySelectorAll('.icon')
        icons.forEach(icon=>{
          if(icon.classList.contains('chatIcon')){
            icon.classList.add(chatClassName)
          }
        })
      })
    })
    
    // root가 block이라면 second-script.js 실행하기
    // 버튼 선택에 따른 과정 보여줌
    firstChat()

  </script>
