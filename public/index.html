<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shopping</title>
</head>
<body>
  <div id="root">
    <head>
      <h1>민지네 장보기</h1>
    </head>
    <main>
      <section>
        <div id="ask">
          <div>A</div>
          <div>목록을 말해줘</div>
        </div>
        <div id="me">
          <div>ME</div>
          <div>
            <ul>
              <li><input type="checkbox" placeholder="list"></li>
            </ul>
            <p></p>
          </div>
        </div>
      </section>
      <section>
        <form action="/add">
          <div>
            <label><input type="radio" name="group">식재료</label>
            <label><input type="radio" name="group">생필품</label>
            <label><input type="radio" name="group">가족 물품</label>
          </div>
          <div>
            <input type="text" name="item" placeholder="이름을 입력해주세요">
            <input type="text" name="count" placeholder="개수">
            <input type="text" name="price" placeholder="가격 (원)">
            <button type="submit">⇧</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
